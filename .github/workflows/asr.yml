name: asr
on:
  push:
    branches: [narracao]
    paths: ['asr/*.mp3']
permissions:
  contents: write
jobs:
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install faster-whisper==1.*
      - run: |
          python - <<'PY'
          import glob, json, os
          from faster_whisper import WhisperModel
          m = WhisperModel('medium', device='cpu', compute_type='int8')
          for f in glob.glob('asr/*.mp3'):
              out = f[:-4] + '.json'
              if os.path.exists(out): continue
              segs, _ = m.transcribe(f, language='pt', word_timestamps=True, vad_filter=False, beam_size=5)
              words = [{'w': w.word, 's': round(w.start, 3), 'e': round(w.end, 3)} for s in segs for w in s.words]
              json.dump(words, open(out, 'w'), ensure_ascii=False, indent=0); print(out, len(words))
          PY
      - run: |
          git config user.name narracao-bot; git config user.email bot@users.noreply.github.com
          git add asr; git commit -m "asr" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
