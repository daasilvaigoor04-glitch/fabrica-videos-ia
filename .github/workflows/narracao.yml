name: narracao
on:
  push:
    branches: [narracao]
    paths: ['jobs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: narracao, cancel-in-progress: false }
jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install edge-tts==7.*
      - run: python tools/gen.py edge
      - uses: actions/upload-artifact@v4
        with: { name: edge, path: out/ }
  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          if python tools/gen.py need chatterbox; then
            pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            pip install chatterbox-tts
            python tools/gen.py chatterbox
          fi
      - uses: actions/upload-artifact@v4
        with: { name: chatterbox, path: out/, if-no-files-found: ignore }
  commit:
    needs: [edge, chatterbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - run: |
          mkdir -p out; cp -rn dl/*/* out/ 2>/dev/null || true
          git config user.name narracao-bot; git config user.email bot@users.noreply.github.com
          git add out; git commit -m "narracao gerada" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
